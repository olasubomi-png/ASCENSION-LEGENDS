version: '3.9'

services:
  # ─── Ascension Legends Bot ────────────────────────────────────────────────
  bot:
    build:
      context: .
      target: production
    container_name: ascension-bot
    restart: unless-stopped
    env_file: .env
    ports:
      - '3001:3001'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ascension-net
    volumes:
      - bot-assets:/app/src/assets

  # ─── MongoDB ──────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: ascension-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: ascension_legends
    volumes:
      - mongodb-data:/data/db
    networks:
      - ascension-net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ascension-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - ascension-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mongodb-data:
  redis-data:
  bot-assets:

networks:
  ascension-net:
    driver: bridge
